[package]
name = "db_backup_service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6"
axum = "0.8.9"
base64 = "0.23"
chrono = "0.4.45"
dotenvy = "0.15.7"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Argon2 is ~50x slower without optimizations, which makes every login take
# seconds in debug builds. Optimize just these crates in dev; your own code
# still compiles fast and debuggable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
